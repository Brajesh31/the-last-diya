<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
  <meta name="theme-color" content="#080a0a" />
  <meta name="description" content="The Last Diya is a cooperative story about bringing light back to a quiet neighbourhood." />
  <meta name="application-name" content="The Last Diya" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/diya-icon.svg" type="image/svg+xml" />
  <title>The Last Diya</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#080a0a;overflow:hidden}
    #game-splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#080a0a;color:#f4f0e8;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;animation:splash-out .65s ease 1.35s forwards;pointer-events:none}
    #game-splash .splash-inner{text-align:center;padding:32px}
    #game-splash .diya{width:42px;height:42px;margin:0 auto 22px;animation:splash-glow 1.2s ease-in-out infinite alternate}
    #game-splash .diya svg{width:100%;height:100%}
    #game-splash .eyebrow{font-size:10px;letter-spacing:.24em;color:#d5a85f}
    #game-splash h1{margin:9px 0 8px;font-size:clamp(28px,5vw,46px);letter-spacing:-.045em;font-weight:700}
    #game-splash p{margin:0;color:#8f918b;font-size:12px;letter-spacing:.04em}
    #game-splash .line{width:120px;height:1px;margin:22px auto 0;background:#3b3429;overflow:hidden}
    #game-splash .line span{display:block;width:40%;height:100%;background:#d6a452;animation:splash-line 1.05s ease-in-out infinite}
    @keyframes splash-out{to{opacity:0;visibility:hidden}}
    @keyframes splash-glow{from{filter:drop-shadow(0 0 3px #d89c3b)}to{filter:drop-shadow(0 0 14px #d89c3b)}}
    @keyframes splash-line{from{transform:translateX(-100%)}to{transform:translateX(350%)}}
    @media(prefers-reduced-motion:reduce){#game-splash{animation:none;opacity:0;visibility:hidden}#game-splash *{animation:none}}
  </style>
</head>
<body>
  <div id="game-splash" aria-label="Loading The Last Diya">
    <div class="splash-inner">
      <div class="diya"><svg viewBox="0 0 128 128" aria-hidden="true"><path d="M28 70c4 22 18 34 36 34s32-12 36-34c-18 7-54 7-72 0Z" fill="#a66a3f"/><path d="M64 67c-10-16 1-29 4-42 12 13 17 27 5 42Z" fill="#f1b85b"/><path d="M64 62c-4-8 1-14 3-20 6 7 7 13 2 20Z" fill="#fff0b5"/></svg></div>
      <div class="eyebrow">A SMALL STORY ABOUT LIGHT</div>
      <h1>The Last Diya</h1>
      <p>Preparing the neighbourhood...</p>
      <div class="line"><span></span></div>
    </div>
  </div>
  <div id="game"></div>
  <noscript>This game requires JavaScript and WebGL.</noscript>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
