services:
  game-server:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "8788:8787"
    environment:
      NODE_ENV: staging
      PORT: 8787
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-http://localhost:5174}
      MAX_CONNECTIONS_PER_IP: ${MAX_CONNECTIONS_PER_IP:-20}
      HANDSHAKE_TIMEOUT_MS: ${HANDSHAKE_TIMEOUT_MS:-10000}
      MESSAGE_RATE_WINDOW_MS: ${MESSAGE_RATE_WINDOW_MS:-10000}
      MAX_MESSAGES_PER_WINDOW: ${MAX_MESSAGES_PER_WINDOW:-240}
      HEARTBEAT_INTERVAL_MS: ${HEARTBEAT_INTERVAL_MS:-15000}
      SESSION_GRACE_MS: ${SESSION_GRACE_MS:-60000}
      BUILD_VERSION: ${BUILD_VERSION:-staging}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
