name: Experience Layer Integration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: experience-layer-integration
  cancel-in-progress: true

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Integrate experience layer
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          main = Path('apps/game/src/main.ts')
          text = main.read_text()

          def once(old, new, label):
              global text
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'Missing integration marker: {label}')
              if text.count(old) != 1:
                  raise SystemExit(f'Ambiguous integration marker: {label} ({text.count(old)} matches)')
              text = text.replace(old, new, 1)

          once(
              "import { movePlayerWithCollision } from './world/player-collision';\n",
              "import { movePlayerWithCollision } from './world/player-collision';\nimport { applyPong, createNetworkExperienceState, interpolateRemoteTransform, shouldSendPing } from './world/network-experience';\n",
              'network import',
          )

          once(
              "  <div class=\"hud-heading\"><strong>THE LAST DIYA</strong><span id=\"connection\" class=\"connection-state\">CONNECTING</span></div>",
              "  <div class=\"hud-heading\"><strong>THE LAST DIYA</strong><span id=\"connection\" class=\"connection-state\">CONNECTING</span></div>\n  <div id=\"latency\" class=\"network-latency\" aria-live=\"polite\">LATENCY --</div>",
              'latency HUD',
          )

          once(
              ".hud .connection-state{font-size:10px;color:#b2b5aa;letter-spacing:.08em}",
              ".hud .connection-state{font-size:10px;color:#b2b5aa;letter-spacing:.08em}.network-latency{font-size:10px;color:#8f938b;letter-spacing:.06em;font-variant-numeric:tabular-nums}",
              'latency CSS',
          )

          once(
              "let finalEventActive = false;\n",
              "let finalEventActive = false;\nconst networkExperience = createNetworkExperienceState();\nconst reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\nfunction setLatency(latencyMs: number | null) {\n  const latency = document.getElementById('latency');\n  if (!latency) return;\n  latency.textContent = latencyMs === null ? 'LATENCY --' : `LATENCY ${Math.round(latencyMs)}ms`;\n}\n",
              'network state',
          )

          once(
              "  if (message.type === 'session_assigned') {\n",
              "  if (message.type === 'pong') { applyPong(networkExperience, message.timestamp, Date.now()); setLatency(networkExperience.latencyMs); return; }\n  if (message.type === 'session_assigned') {\n",
              'pong handling',
          )

          once(
              "    reconnectAttempt = 0;\n    setConnectionState('ONLINE');",
              "    reconnectAttempt = 0;\n    networkExperience.reconnectCount += 1;\n    setConnectionState('ONLINE');",
              'reconnect telemetry',
          )

          once(
              "  if (message.type === 'player_state') { const remote = remotePlayers.get(message.playerId); if (remote) { remote.target.set(message.transform.x, message.transform.y, message.transform.z); remote.rotation = message.transform.rotation; } return; }",
              "  if (message.type === 'player_state') { const remote = remotePlayers.get(message.playerId); if (remote) { remote.target.set(message.transform.x, message.transform.y, message.transform.z); remote.rotation = message.transform.rotation; } return; }",
              'remote state anchor',
          )

          once(
              "  const inputX = Number(keys.has('d') || keys.has('arrowright')) - Number(keys.has('a') || keys.has('arrowleft'));",
              "  const pingAt = Date.now();\n  if (socket?.readyState === WebSocket.OPEN && shouldSendPing(networkExperience, pingAt)) send({ type: 'ping', timestamp: pingAt });\n  const inputX = Number(keys.has('d') || keys.has('arrowright')) - Number(keys.has('a') || keys.has('arrowleft'));",
              'ping scheduling',
          )

          once(
              "    remote.mesh.position.lerp(remote.target, Math.min(1, deltaSeconds * 10));\n    remote.mesh.rotation.y = THREE.MathUtils.lerp(remote.mesh.rotation.y, remote.rotation, Math.min(1, deltaSeconds * 10));",
              "    const remoteRotation = interpolateRemoteTransform(remote.mesh.position, remote.target, remote.mesh.rotation.y, remote.rotation, deltaSeconds, reducedMotion ? 7 : 10).rotation;\n    remote.mesh.rotation.y = remoteRotation;",
              'remote interpolation',
          )

          once(
              "        finalEventActive,\n        remoteAvatarLodEnabled,",
              "        finalEventActive,\n        latencyMs: networkExperience.latencyMs,\n        reconnectCount: networkExperience.reconnectCount,\n        remoteAvatarLodEnabled,",
              'E2E network state',
          )

          once(
              "  diya.rotation.y += deltaSeconds * 0.35;\n  flame.scale.y = 1.55 + Math.sin(now * 0.006) * 0.25;\n  communityFlame.scale.y = 1.9 + Math.sin(now * 0.004) * 0.25;\n  memoryMarker.rotation.y += deltaSeconds * 0.6;",
              "  if (!reducedMotion) {\n    diya.rotation.y += deltaSeconds * 0.35;\n    flame.scale.y = 1.55 + Math.sin(now * 0.006) * 0.25;\n    communityFlame.scale.y = 1.9 + Math.sin(now * 0.004) * 0.25;\n    memoryMarker.rotation.y += deltaSeconds * 0.6;\n  }",
              'reduced motion',
          )

          once(
              "connect();\nrequestAnimationFrame(update);",
              "connect();\nsetLatency(null);\nrequestAnimationFrame(update);\n\naddEventListener('beforeunload', () => {\n  touchControls.dispose();\n  celebration.dispose();\n  memorySequence.close();\n  clearRemotePlayers();\n  if (socket) socket.close();\n});",
              'resource cleanup',
          )

          main.write_text(text)
          PY

      - name: Install dependencies
        run: npm install

      - name: Verify experience layer
        run: |
          npm run test:network-experience
          npm run typecheck
          npm run build

      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/game/src/main.ts .github/workflows/experience-layer-integration.yml
          if git diff --cached --quiet; then
            echo "Experience layer already integrated."
            exit 0
          fi
          git commit -m "feat(game): integrate network experience and recovery UX"
          git push
