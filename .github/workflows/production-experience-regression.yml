name: Production Experience Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-experience-${{ github.ref }}
  cancel-in-progress: true

jobs:
  experience:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Build performance budget
        run: npm run test:build:budget
      - name: Protocol regression
        run: npm run test:protocol
      - name: Network experience regression
        run: npm run test:network-experience
      - name: Contextual feedback regression
        run: npm run test:experience-feedback
      - name: Reconnect and final event regression
        run: npm run test:reconnect-final-event
      - name: Renderer disposal audit
        run: node scripts/renderer-disposal-audit.mjs
      - name: Player collision regression
        run: npm run test:collision
      - name: Vertical slice regression
        run: npm run test:vertical-slice
      - name: Start server
        shell: bash
        run: |
          PORT=8787 node apps/server/dist/index.js > /tmp/the-last-diya-server.log 2>&1 &
          echo $! > /tmp/the-last-diya-server.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/the-last-diya-server.log
          exit 1
      - name: Production health regression
        env:
          HEALTH_URL: http://127.0.0.1:8787
        run: npm run test:production:health
      - name: Start game client
        shell: bash
        run: |
          npm run preview --workspace=@the-last-diya/game -- --host 127.0.0.1 --port 5174 > /tmp/the-last-diya-client.log 2>&1 &
          echo $! > /tmp/the-last-diya-client.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:5174/?e2e=1 > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/the-last-diya-client.log
          exit 1
      - name: Browser multiplayer journey
        env:
          GAME_URL: http://127.0.0.1:5174/?e2e=1
          GAME_SERVER_URL: ws://127.0.0.1:8787
          BROWSER_TIMEOUT_MS: 30000
          BROWSER_STARTUP_TIMEOUT_MS: 60000
        run: npm run test:browser:multiplayer
      - name: Browser mobile journey
        env:
          GAME_URL: http://127.0.0.1:5174/?e2e=1
          GAME_SERVER_URL: ws://127.0.0.1:8787
          BROWSER_TIMEOUT_MS: 30000
        run: npm run test:browser:mobile
      - name: Browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-experience-browser-logs
          path: |
            /tmp/the-last-diya-server.log
            /tmp/the-last-diya-client.log
          if-no-files-found: ignore
      - name: Stop local services
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/the-last-diya-client.pid ]; then kill "$(cat /tmp/the-last-diya-client.pid)" || true; fi
          if [ -f /tmp/the-last-diya-server.pid ]; then kill "$(cat /tmp/the-last-diya-server.pid)" || true; fi
