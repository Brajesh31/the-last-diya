name: Server Security Regression

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/server/**'
      - 'packages/shared/**'
      - 'packages/game-core/**'
      - 'packages/networking/**'
      - 'scripts/server-security-test.mjs'
      - 'package.json'
      - '.github/workflows/server-security-test.yml'
  pull_request:
    paths:
      - 'apps/server/**'
      - 'packages/shared/**'
      - 'packages/game-core/**'
      - 'packages/networking/**'
      - 'scripts/server-security-test.mjs'
      - 'package.json'
      - '.github/workflows/server-security-test.yml'

jobs:
  security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SESSION_GRACE_MS: '1200'
      HEARTBEAT_INTERVAL_MS: '500'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build workspaces
        run: npm run build

      - name: Start game server
        run: npx tsx apps/server/src/index.ts > server.log 2>&1 &

      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8787/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat server.log
          exit 1

      - name: Run server security regression suite
        run: npm run test:server-security

      - name: Server log
        if: always()
        run: cat server.log
