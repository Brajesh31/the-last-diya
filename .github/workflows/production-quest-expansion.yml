name: Production Quest Expansion

on:
  push:
    paths:
      - '.github/workflows/production-quest-expansion.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand-quest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply post-finale quest and compatibility fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_if_present(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old in text:
                  p.write_text(text.replace(old, new, 1))
                  return True
              return False

          def ensure(path, marker, insertion):
              p = Path(path)
              text = p.read_text()
              if marker in text:
                  return False
              anchor = insertion[0]
              value = insertion[1]
              if anchor not in text:
                  raise SystemExit(f'Anchor not found in {path}: {anchor[:120]}')
              p.write_text(text.replace(anchor, value, 1))
              return True

          # Quest type is idempotent.
          replace_if_present(
              'packages/shared/src/index.ts',
              "export type QuestId = 'first-flame' | 'help-sharma-aunty' | 'market-lights' | 'temple-memory' | 'last-diya';",
              "export type QuestId = 'first-flame' | 'help-sharma-aunty' | 'market-lights' | 'temple-memory' | 'last-diya' | 'share-the-light';",
          )
          replace_if_present(
              'packages/game-core/src/quests.ts',
              "export type QuestId = 'first-flame' | 'help-sharma-aunty' | 'market-lights' | 'temple-memory' | 'last-diya';",
              "export type QuestId = 'first-flame' | 'help-sharma-aunty' | 'market-lights' | 'temple-memory' | 'last-diya' | 'share-the-light';",
          )
          ensure(
              'packages/game-core/src/quests.ts',
              "id: 'share-the-light'",
              ("  { id: 'last-diya', title: 'The Last Diya', description: 'Carry the final flame to the dark district.', requires: ['temple-memory'] },\n",
               "  { id: 'last-diya', title: 'The Last Diya', description: 'Carry the final flame to the dark district.', requires: ['temple-memory'] },\n  { id: 'share-the-light', title: 'Share the Light', description: 'Keep the celebration alive by sharing your flame with three neighbours.', requires: ['last-diya'], reward: { itemId: 'sweet', quantity: 2 } },\n"),
          )
          replace_if_present(
              'packages/game-core/src/quests.ts',
              "target: quest.id === 'market-lights' ? 3 : 1,",
              "target: quest.id === 'market-lights' || quest.id === 'share-the-light' ? 3 : 1,",
          )
          replace_if_present(
              'apps/server/src/index.ts',
              "    increaseLight(player.roomId, player.id, 5); broadcastRoom(player.roomId, { type: 'flame_shared', fromPlayerId: player.id, toPlayerId: target.id, lightLevel: getRoomLight(player.roomId) }); return;",
              "    increaseLight(player.roomId, player.id, 5);\n    advanceQuest(player, 'share-the-light');\n    broadcastRoom(player.roomId, { type: 'flame_shared', fromPlayerId: player.id, toPlayerId: target.id, lightLevel: getRoomLight(player.roomId) }); return;",
          )
          ensure(
              'apps/game/src/main.ts',
              "'share-the-light': { threshold: 100",
              ("  'unknown-stranger': { threshold: 85, text: 'The last district is opening. Some memories return only when the light is shared.' },\n",
               "  'unknown-stranger': { threshold: 85, text: 'The last district is opening. Some memories return only when the light is shared.' },\n  'share-the-light': { threshold: 100, text: 'The street is bright again. Do not let the flame stop with you. Share it.' },\n"),
          )

          # Repair the production visual update signatures that previously broke typecheck.
          replacements = [
              ('  npcActivity.update(deltaSeconds, lightLevel);', '  npcActivity.update(lightLevel, now / 1000, deltaSeconds);'),
              ('  environmentStory.update(deltaSeconds, lightLevel);', '  environmentStory.update(lightLevel, now / 1000);'),
              ('  neighbourhoodProps.update(deltaSeconds, lightLevel);', '  neighbourhoodProps.update(lightLevel, now / 1000);'),
              ('  playerCharacter.update(deltaSeconds, moveDirection.lengthSq() > 0);', '  playerCharacter.update(lightLevel, now / 1000, deltaSeconds, moveDirection.lengthSq() > 0);'),
              ('    remote.visual.update(deltaSeconds, remote.mesh.position.distanceTo(remote.target) > 0.02);', '    remote.visual.update(lightLevel, now / 1000, deltaSeconds, remote.mesh.position.distanceTo(remote.target) > 0.02);'),
              ('  atmosphereVfx.update(deltaSeconds, lightLevel);', '  atmosphereVfx.update(lightLevel, deltaSeconds, now / 1000);'),
          ]
          for old, new in replacements:
              replace_if_present('apps/game/src/main.ts', old, new)

          replace_if_present(
              'docs/ROADMAP.md',
              '- [ ] Extended quest content beyond the five-quest vertical slice',
              '- [x] First post-finale cooperative epilogue quest: Share the Light\n- [ ] Extended quest content beyond the six-quest story arc',
          )
      - name: Verify
        run: |
          npm install
          npm run typecheck
          npm run build
      - name: Commit changes when needed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/shared/src/index.ts packages/game-core/src/quests.ts apps/server/src/index.ts apps/game/src/main.ts docs/ROADMAP.md
          git diff --cached --quiet && exit 0
          git commit -m 'feat: finalize post-finale quest compatibility'
          git push
