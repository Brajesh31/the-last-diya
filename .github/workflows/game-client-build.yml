name: Game Client Build

on:
  push:
    branches: [main]
    paths:
      - "apps/game/**"
      - "packages/game-core/**"
      - "packages/shared/**"
      - "packages/networking/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/game-client-build.yml"
  pull_request:
    paths:
      - "apps/game/**"
      - "packages/game-core/**"
      - "packages/shared/**"
      - "packages/networking/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/game-client-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Typecheck and build workspaces
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Build workspaces
        run: npm run build
