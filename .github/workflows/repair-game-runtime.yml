name: Repair Game Runtime

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-game-runtime
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Repair only missing runtime pieces
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          main = Path('apps/game/src/main.ts')
          text = main.read_text()

          if 'const keys = new Set<string>();' not in text:
              marker = 'let reconnectAttempt = 0;\n'
              if marker not in text:
                  raise SystemExit('Cannot locate reconnect state marker')
              text = text.replace(marker, marker + 'const keys = new Set<string>();\n', 1)

          if 'let lastNetworkSend = 0;' not in text:
              marker = 'let socket: WebSocket | null = null;\n'
              if marker not in text:
                  raise SystemExit('Cannot locate socket marker')
              text = text.replace(marker, marker + 'let lastNetworkSend = 0;\n', 1)

          text = text.replace(
              'let sessionToken = localStorage.getItem(SESSION_STORAGE_KEY);',
              'let sessionToken: string | undefined = localStorage.getItem(SESSION_STORAGE_KEY) ?? undefined;',
              1,
          )
          main.write_text(text)

          celebration = Path('apps/game/src/world/celebration.ts')
          c = celebration.read_text()
          if 'setVisible(visible: boolean): void;' not in c:
              marker = '  trigger(): void;\n'
              if marker not in c:
                  raise SystemExit('Cannot locate celebration interface marker')
              c = c.replace(marker, marker + '  setVisible(visible: boolean): void;\n', 1)
          if '    setVisible(visible) {' not in c:
              marker = '    trigger() {\n'
              if marker not in c:
                  raise SystemExit('Cannot locate celebration trigger marker')
              c = c.replace(marker, '    setVisible(visible) {\n      group.visible = visible;\n      if (!visible) { active = false; return; }\n      if (!active) { active = true; elapsed = 0; }\n    },\n' + marker, 1)
          celebration.write_text(c)
          PY

      - name: Install dependencies
        run: npm install

      - name: Verify repair
        run: |
          npm run typecheck
          npm run build

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/game/src/main.ts apps/game/src/world/celebration.ts
          if git diff --cached --quiet; then
            echo "No repair changes required."
            exit 0
          fi
          git commit -m "fix(game): restore missing runtime pieces"
          git push
