name: Multiplayer Load Test

on:
  workflow_dispatch:
    inputs:
      counts:
        description: Comma-separated player counts to test
        required: false
        default: '2,5,10,20,30'
  push:
    branches: [main]
    paths:
      - 'apps/server/**'
      - 'packages/shared/**'
      - 'packages/game-core/**'
      - 'packages/networking/**'
      - 'scripts/multiplayer-load-test.mjs'
      - '.github/workflows/multiplayer-load-test.yml'
  pull_request:
    paths:
      - 'apps/server/**'
      - 'packages/shared/**'
      - 'packages/game-core/**'
      - 'packages/networking/**'
      - 'scripts/multiplayer-load-test.mjs'
      - '.github/workflows/multiplayer-load-test.yml'

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build workspaces
        run: npm run build

      - name: Start game server
        run: npx tsx apps/server/src/index.ts > server.log 2>&1 &

      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8787/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat server.log
          exit 1

      - name: Run multiplayer load test
        env:
          LOAD_COUNTS: ${{ inputs.counts || '2,5,10,20,30' }}
        run: npm run test:multiplayer:load

      - name: Server log
        if: always()
        run: cat server.log
