name: Security and Observability

on:
  push:
    paths:
      - 'apps/server/**'
      - 'packages/networking/**'
      - 'packages/shared/**'
      - '.github/workflows/security-observability.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hardening:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Verify production server safeguards
        shell: python
        run: |
          from pathlib import Path
          path = Path('apps/server/src/index.ts')
          text = path.read_text()
          required = [
            'maxPayload: 16 * 1024',
            'perMessageDeflate: false',
            'MAX_CONNECTIONS_PER_IP',
            'HANDSHAKE_TIMEOUT_MS',
            'MESSAGE_RATE_WINDOW_MS',
            'MAX_MESSAGES_PER_WINDOW',
            'WS_ALLOWED_ORIGINS',
            'HEARTBEAT_INTERVAL_MS',
            'SESSION_GRACE_MS',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('Missing production safeguards: ' + ', '.join(missing))
      - name: Build and start regression server
        env:
          PORT: 8787
          NODE_ENV: test
          WS_ALLOWED_ORIGINS: https://game.example.test
        run: |
          npm run typecheck
          npm run build
          node apps/server/dist/index.js > /tmp/the-last-diya-security-server.log 2>&1 &
          echo $! > /tmp/the-last-diya-security-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8787/health > /tmp/security-health.json; then
              cat /tmp/security-health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/the-last-diya-security-server.log
          exit 1
      - name: Verify security regression suite
        env:
          WS_ALLOWED_ORIGINS: https://game.example.test
        run: |
          npm run test:server-security
          npm run test:server-hardening
      - name: Stop regression server
        if: always()
        run: |
          if [ -f /tmp/the-last-diya-security-server.pid ]; then kill "$(cat /tmp/the-last-diya-security-server.pid)" || true; fi
          cat /tmp/the-last-diya-security-server.log || true
      - name: Commit verified security baseline
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/security-observability.yml
          git diff --cached --quiet && exit 0
          git commit -m 'ci(server): enforce production security baseline'
          git push
