name: Rendering Polish

on:
  push:
    paths:
      - 'apps/game/src/main.ts'
      - '.github/workflows/rendering-polish.yml'

permissions:
  contents: write

jobs:
  rendering:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply production color pipeline
        shell: python
        run: |
          from pathlib import Path
          path = Path('apps/game/src/main.ts')
          text = path.read_text()
          old = "renderer.setPixelRatio(Math.min(devicePixelRatio, lowQualityMode ? 1 : 2));\nrenderer.setSize(innerWidth, innerHeight);\nrenderer.shadowMap.enabled = !lowQualityMode;"
          new = "renderer.setPixelRatio(Math.min(devicePixelRatio, lowQualityMode ? 1 : 2));\nrenderer.setSize(innerWidth, innerHeight);\nrenderer.outputColorSpace = THREE.SRGBColorSpace;\nrenderer.toneMapping = THREE.ACESFilmicToneMapping;\nrenderer.toneMappingExposure = 1.05;\nrenderer.shadowMap.type = THREE.PCFSoftShadowMap;\nrenderer.shadowMap.enabled = !lowQualityMode;"
          if old not in text:
              raise SystemExit('rendering anchor not found')
          path.write_text(text.replace(old, new, 1))
      - name: Improve environment material response
        shell: python
        run: |
          from pathlib import Path
          path = Path('apps/game/src/main.ts')
          text = path.read_text()
          old = "const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: 0x20211f, roughness: 1 }));"
          new = "const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: 0x20211f, roughness: 0.92, metalness: 0.02 }));"
          if old in text:
              text = text.replace(old, new, 1)
          old = "const road = new THREE.Mesh(new THREE.PlaneGeometry(8, 60), new THREE.MeshStandardMaterial({ color: 0x343432, roughness: 1 }));"
          new = "const road = new THREE.Mesh(new THREE.PlaneGeometry(8, 60), new THREE.MeshStandardMaterial({ color: 0x343432, roughness: 0.82, metalness: 0.03 }));"
          if old in text:
              text = text.replace(old, new, 1)
          old = "const hemi = new THREE.HemisphereLight(0x91a0b2, 0x17120c, 0.45);"
          new = "const hemi = new THREE.HemisphereLight(0x91a0b2, 0x17120c, 0.38);"
          if old in text:
              text = text.replace(old, new, 1)
          old = "const moon = new THREE.DirectionalLight(0xaabbd2, 1);"
          new = "const moon = new THREE.DirectionalLight(0xaabbd2, 1.15);"
          if old in text:
              text = text.replace(old, new, 1)
          path.write_text(text)
      - name: Verify
        run: |
          npm run typecheck
          npm run build
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/game/src/main.ts
          git diff --cached --quiet && exit 0
          git commit -m 'feat(game): polish production rendering pipeline'
          git push
