name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Collision regression
        run: npm run test:collision
      - name: Server security regression
        run: npm run test:server-security
      - name: Server hardening regression
        run: npm run test:server-hardening
      - name: Multiplayer regression
        run: npm run test:multiplayer
      - name: Mobile browser regression
        run: npm run test:browser:mobile
      - name: Browser performance regression
        run: npm run test:browser:perf
