name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Protocol compatibility regression
        run: npm run test:protocol
      - name: Collision regression
        run: npm run test:collision
      - name: Start server for runtime regressions
        shell: bash
        run: |
          node apps/server/dist/index.js > /tmp/the-last-diya-server.log 2>&1 &
          echo $! > /tmp/the-last-diya-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8787/health > /tmp/the-last-diya-health.json; then
              cat /tmp/the-last-diya-health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/the-last-diya-server.log
          exit 1
      - name: Server security regression
        run: npm run test:server-security
      - name: Server hardening regression
        run: npm run test:server-hardening
      - name: Multiplayer regression
        run: npm run test:multiplayer
      - name: Mobile browser regression
        run: npm run test:browser:mobile
      - name: Browser performance regression
        run: npm run test:browser:perf
      - name: Stop regression server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/the-last-diya-server.pid ]; then
            kill "$(cat /tmp/the-last-diya-server.pid)" 2>/dev/null || true
          fi
          if [ -f /tmp/the-last-diya-server.log ]; then
            tail -n 40 /tmp/the-last-diya-server.log || true
          fi
